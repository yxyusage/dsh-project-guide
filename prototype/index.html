<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>记账本 · 项目导览</title>
<style>
  :root {
    --bg:      var(--dsw-alias-bg-base, #131417);
    --layer1:  var(--dsw-alias-bg-layer-1, #191b1f);
    --layer2:  var(--dsw-alias-bg-layer-2, #202329);
    --border:  var(--dsw-alias-border-l1, #2a2d34);
    --border2: var(--dsw-alias-border-l2, #3a3f48);
    --text:    var(--dsw-alias-label-primary, #e9ebee);
    --muted:   var(--dsw-alias-label-secondary, #9aa1ab);
    --brand:   var(--dsw-alias-brand-primary, #5b8cff);
    --ok:      var(--dsw-alias-state-success-primary, #3fb950);
    --warn:    var(--dsw-alias-state-warn-primary, #d29922);
    --danger:  var(--dsw-alias-state-error-primary, #f85149);
    --idle:    var(--dsw-alias-state-idle-primary, #6b7280);
    --rail:    var(--dsw-specific-sidebar-fill, #0f1013);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:      var(--dsw-alias-bg-base, #ffffff);
      --layer1:  var(--dsw-alias-bg-layer-1, #f7f8fa);
      --layer2:  var(--dsw-alias-bg-layer-2, #eef0f4);
      --border:  var(--dsw-alias-border-l1, #e3e6eb);
      --border2: var(--dsw-alias-border-l2, #cdd2da);
      --text:    var(--dsw-alias-label-primary, #1a1d21);
      --muted:   var(--dsw-alias-label-secondary, #5f6670);
      --brand:   var(--dsw-alias-brand-primary, #2f6bff);
      --ok:      var(--dsw-alias-state-success-primary, #1a7f37);
      --warn:    var(--dsw-alias-state-warn-primary, #9a6700);
      --danger:  var(--dsw-alias-state-error-primary, #c3281f);
      --idle:    var(--dsw-alias-state-idle-primary, #8b929c);
      --rail:    var(--dsw-specific-sidebar-fill, #f4f5f7);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; }

  /* ---------- left rail ---------- */
  .rail {
    background: var(--rail);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .rail-head { padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
  .proj { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .proj-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tree { flex: 1; overflow: auto; padding: 10px 8px 24px; }
  .group-label {
    font-size: 11px; color: var(--idle); letter-spacing: .06em;
    padding: 16px 10px 6px;
  }
  .ti {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-radius: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .ti:hover { background: var(--layer2); color: var(--text); }
  .ti.on { background: var(--layer2); color: var(--text); }
  .ti .nm { overflow: hidden; text-overflow: ellipsis; }
  .ti .cnt { margin-left: auto; font-size: 11px; color: var(--idle); font-variant-numeric: tabular-nums; }
  .ti .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }
  .ti.lvl1 { padding-left: 22px; }
  .ti.ghost { color: var(--idle); }
  .rain-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--idle); line-height: 1.5; }

  /* ---------- main ---------- */
  .main { overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 34px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .status { font-size: 12px; color: var(--muted); }
  .status b { color: var(--text); font-weight: 500; }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border2); background: transparent;
    color: var(--muted); border-radius: 7px; padding: 5px 11px;
    font-size: 12.5px; cursor: pointer;
  }
  .btn:hover { color: var(--text); border-color: var(--idle); }
  .btn.primary { color: var(--text); border-color: var(--border2); }

  .content { max-width: 830px; padding: 30px 34px 96px; }

  /* ---------- overview ---------- */
  .eyebrow { font-size: 12px; color: var(--idle); letter-spacing: .08em; }
  h1 { font-size: 26px; line-height: 1.35; margin: 8px 0 6px; font-weight: 600; letter-spacing: -.01em; }
  .lede { color: var(--muted); font-size: 14.5px; }
  .what { margin: 22px 0 0; }
  .what p { margin: 0 0 10px; font-size: 15px; line-height: 1.85; color: var(--text); }
  .what p:last-child { color: var(--muted); }

  .sec-h {
    display: flex; align-items: baseline; gap: 10px;
    margin: 40px 0 16px;
  }
  .sec-h h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .sec-h span { font-size: 12px; color: var(--idle); }

  .blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .blk {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 15px 13px; background: var(--layer1);
    cursor: pointer; transition: border-color .15s, transform .15s, background .15s;
    position: relative;
  }
  .blk:hover { border-color: var(--border2); background: var(--layer2); transform: translateY(-1px); }
  .blk-top { display: flex; align-items: center; gap: 8px; }
  .blk-name { font-size: 13.5px; font-weight: 600; }
  .blk-tag {
    margin-left: auto; font-size: 10.5px; color: var(--idle);
    border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px;
  }
  .blk-line { font-size: 12.5px; color: var(--muted); margin-top: 7px; line-height: 1.6; }
  .dot-ok { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot-open { width: 6px; height: 6px; border-radius: 50%; background: var(--idle); flex: none; }

  .route { list-style: none; padding: 0; margin: 0; counter-reset: r; }
  .route li {
    display: flex; gap: 14px; padding: 13px 0;
    border-bottom: 1px dashed var(--border);
  }
  .route li:last-child { border-bottom: 0; }
  .rnum {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    border: 1px solid var(--border2); color: var(--muted);
    font-size: 11.5px; display: grid; place-items: center;
    font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .rtitle { font-size: 14px; }
  .rfile {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; color: var(--brand);
    background: color-mix(in srgb, var(--brand) 12%, transparent);
    border-radius: 4px; padding: 1px 5px;
  }
  .rwhy { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  details.ignore {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--layer1); overflow: hidden;
  }
  details.ignore summary {
    cursor: pointer; padding: 13px 16px; font-size: 13.5px; list-style: none;
    display: flex; align-items: center; gap: 10px;
  }
  details.ignore summary::-webkit-details-marker { display: none; }
  details.ignore summary::before { content: "▸"; color: var(--idle); font-size: 11px; }
  details.ignore[open] summary::before { content: "▾"; }
  .ig-list { padding: 2px 16px 14px 38px; }
  .ig-row { display: flex; gap: 12px; padding: 5px 0; font-size: 13px; }
  .ig-row code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--muted); min-width: 118px;
  }
  .ig-row span { color: var(--idle); font-size: 12.5px; }

  .fineprint { margin-top: 44px; font-size: 11.5px; color: var(--idle); line-height: 1.8; }

  /* ---------- folder card ---------- */
  .crumb { font-size: 12px; color: var(--idle); font-family: ui-monospace, Consolas, monospace; }
  .crumb b { color: var(--muted); font-weight: 400; }

  .segs {
    display: inline-flex; padding: 3px; gap: 2px; margin: 16px 0 0;
    background: var(--layer1); border: 1px solid var(--border); border-radius: 8px;
  }
  .segs button {
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  }
  .segs button:hover { color: var(--text); }
  .segs button.on { background: var(--layer2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

  .card { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 22px; }
  .prose { font-size: 14.5px; line-height: 1.9; margin: 0 0 16px; }
  .say {
    margin: 16px 0 0; padding-left: 14px;
    border-left: 2px solid var(--border2);
    color: var(--muted); font-size: 14px; line-height: 1.85;
  }
  .kv { margin: 0; padding: 0; list-style: none; }
  .kv li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 14px; line-height: 1.7; }
  .kv li:last-child { border-bottom: 0; }
  .kv .k { color: var(--idle); font-size: 12.5px; min-width: 56px; padding-top: 3px; flex: none; }
  .kv .v { color: var(--text); }

  .effect {
    margin-top: 22px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--layer1); padding: 14px 16px;
  }
  .effect-h { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); }
  .pill {
    font-size: 11.5px; border-radius: 20px; padding: 2px 9px; border: 1px solid transparent;
  }
  .pill.safe    { color: var(--ok);     background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.careful { color: var(--warn);   background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.risky   { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .effect p { margin: 9px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.75; }

  .rel { margin-top: 24px; }
  .rel-h { font-size: 12.5px; color: var(--idle); margin-bottom: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 8px; color: var(--muted); background: var(--layer1);
  }

  .deeper { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 18px; }
  .deep-row { display: flex; gap: 12px; padding: 9px 0; align-items: flex-start; }
  .deep-k {
    flex: none; width: 54px; font-size: 11.5px; color: var(--idle);
    padding-top: 2px; text-align: right;
  }
  .deep-v { font-size: 13.5px; color: var(--text); line-height: 1.7; }
  .deep-v code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    color: var(--brand);
  }
  .deep-v .ask {
    display: block; color: var(--muted); font-size: 13px; margin-top: 2px;
  }

  .card-foot { display: flex; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
  .foot-btn {
    border: 1px solid var(--border2); background: transparent; color: var(--muted);
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .foot-btn:hover { color: var(--text); border-color: var(--idle); }
  .foot-btn.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }

  .known-box {
    margin-top: 18px; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; background: var(--layer1);
    display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--muted);
  }
  .known-box b { color: var(--text); font-weight: 500; }

  .correct {
    margin-top: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--layer1); padding: 12px 14px; display: none;
  }
  .correct.open { display: block; }
  .correct textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; min-height: 58px;
    outline: none;
  }
  .correct textarea:focus { border-color: var(--brand); }
  .correct-bar { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .correct-note { font-size: 11.5px; color: var(--idle); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    background: var(--layer2); border: 1px solid var(--border2);
    color: var(--text); font-size: 13px; padding: 9px 16px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fact-flag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--idle); margin-left: 8px;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .content, .topbar { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="proj">记账本</div>
      <div class="proj-sub">个人记账网页 · 本地运行</div>
    </div>
    <nav class="tree" id="tree"></nav>
    <div class="rain-foot">看懂的地方会自己安静下来，<br>不懂的随时可以再问。</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="status" id="status"></div>
      <div class="spacer"></div>
      <button class="btn" data-action="refresh">重新读一遍代码</button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     假数据：一个虚构的「记账本」项目。
     真实版本里，下面「事实」字段由工具从代码算出来，
     「人话」字段由 AI 读完代码后写，并标注 AI 的理解。
     ============================================================ */

  const PROJECT = {
    name: "记账本",
    status: "地图生成于 2 分钟前 · 42 个文件 · 6 个区域",
    what: [
      "这是一个在浏览器里用的记账工具。记一笔支出，它帮你分类，再按月算占比。",
      "现在能做三件事：记一笔、看流水、看月度饼图。数据存在你自己的电脑上。",
      "还没做：多人共享、导出 Excel、手机端适配。"
    ],
    blocks: [
      { id: "entry",      name: "入口",   tag: "1 个文件", line: "整个网站从这里开始跑起来，几十行，基本不用改。", known: true },
      { id: "pages",      name: "页面",   tag: "3 个文件", line: "你真正看到的三屏：记账、流水、统计。",       known: true },
      { id: "components", name: "零件",   tag: "8 个文件", line: "按钮、卡片、日期选择器，做好放在这，页面拿去用。", known: true },
      { id: "store",      name: "数据",   tag: "2 个文件", line: "账目的保管员：规定一笔账长什么样，负责存取。", known: false },
      { id: "server",     name: "后端",   tag: "2 个文件", line: "一个很小的柜台，把账目写进数据库再读出来。",   known: false },
      { id: "styles",     name: "样子",   tag: "2 个文件", line: "全站的配色、字号、间距都定在这。",             known: false }
    ],
    route: [
      { file: "index.html", why: "先看它怎么把整个程序启动起来。只有十几行，像钥匙孔。" },
      { file: "src/pages/Add.jsx", why: "你最常用的「记一笔」就是这一页，看完就懂一半了。" },
      { file: "src/store/records.js", why: "数据怎么写进去、怎么取出来。看懂这块，你就知道改哪儿会连累哪儿。" }
    ],
    ignore: [
      { name: "package.json", why: "给工具看的清单，写着用到哪些现成的库。想加新功能时才需要碰。" },
      { name: "node_modules/", why: "别人写好的库都下载在这里，几万个文件。永远不用打开。" },
      { name: "dist/",         why: "打包后生成的成品，每次运行自动重建。改了也会被覆盖。" },
      { name: "vite.config.js", why: "启动工具的设置，只有一个字段有用：端口号。" },
      { name: ".gitignore",    why: "告诉 Git 哪些文件别存进历史。" }
    ]
  };

  const CARDS = {
    entry: {
      path: "index.html",
      title: "整个网站的入口",
      sub: "一切从这里开始",
      count: 1,
      depth: {
        plain: {
          lead: "整个网站是从这一个文件开始跑起来的。它不画界面，只做一件事：把真正的程序（src/main.js）加载进来。",
          say: "打比方：像大门的钥匙孔。插对了，整栋楼的灯才会亮。",
          effect: "改错了会整个页面白屏，而且看不出是哪里错。这里适合“照着改”，不适合自由发挥。",
          safety: "risky"
        },
        structured: {
          lead: "职责：提供挂载点，按顺序引入样式和入口脚本。",
          points: [
            { k: "职责", v: "声明页面结构（一个空的 div）并加载构建后的脚本。" },
            { k: "边界", v: "不含任何业务逻辑，也不该出现具体样式。" },
            { k: "影响", v: "改动会作用于全部页面，因为它是唯一的 HTML 宿主。" }
          ],
          effect: "这一层的错误通常是“整页空白”：脚本加载顺序、路径大小写都会导致它。",
          safety: "risky"
        },
        code: {
          lead: "1 个文件，14 行。它只做三件事：定语言、给挂载点、引脚本。",
          points: [
            { k: "事实", v: "被浏览器直接请求，不经打包；引用的 /src/main.js 由 Vite 在开发时注入。" },
            { k: "事实", v: "全项目只有这里出现 &lt;div id=\"root\"&gt;，React 的挂载点就是它。" },
            { k: "判断", v: "没有业务逻辑依赖它，所以它坏了不会是“某个功能坏”，而是“全站白屏”。" }
          ],
          effect: "这一层的错误通常是“整页空白”：脚本加载顺序、路径大小写都会导致它。",
          safety: "risky"
        }
      },
      relatedLabel: "它和谁连着",
      related: ["src/main.js", "src/App.jsx", "public/favicon.ico"],
      deeper: {
        search: "单页应用的入口文件是怎么工作的",
        read: "index.html（14 行，是全项目最短的文件）",
        ask: "这个 index.html 里的 div 和 main.js 是怎么接上的？"
      }
    },

    pages: {
      path: "src/pages",
      title: "你看到的三个页面",
      sub: "记账 · 流水 · 统计",
      count: 3,
      depth: {
        plain: {
          lead: "这里放着你真正看到的三个页面。一个文件就是一屏：摆什么、点了去哪儿，都在这写。",
          say: "打比方：像一本书的三个章节。每章各管一段，翻到哪章由链接决定。",
          effect: "改这里会马上看见变化，三个页面互相独立，改坏一个不影响另外两个。",
          safety: "careful"
        },
        structured: {
          lead: "职责：组织一屏的内容——放哪些零件、从哪种数据取数、按钮点了跳哪里。",
          points: [
            { k: "职责", v: "页面级容器：布局 + 取数 + 事件分发。" },
            { k: "边界", v: "不直接存数据，也不做统计计算；这些都在 store 里。" },
            { k: "数据流", v: "store → pages → components，单向。页面之间不互相引用。" }
          ],
          effect: "三个页面各约 120 行，彼此没有 import 关系，改动影响范围基本限定在当前页。",
          safety: "careful"
        },
        code: {
          lead: "3 个文件。Add.jsx 引用了 components 里的 DatePicker 和 AmountInput；Stats.jsx 引入了图表库。三者之间没有互相引用。",

    renderTree();
    renderStatus();
    $("view").innerHTML = state.view === "home" ? renderHome() : renderCard(state.view);
    $("view").scrollTop = 0;
    document.querySelector(".main").scrollTop = 0;
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", (e) => {
    const viewEl = e.target.closest("[data-view]");
    if (viewEl) {
      const id = viewEl.getAttribute("data-view");
      if (id !== state.view) {
        state.view = id;
        state.correcting = false;
        state.simplifyHint = false;
        try { history.replaceState(null, "", id === "home" ? "#" : "#" + id); } catch (err) {}
        render();
      }
      return;
    }

    const depthEl = e.target.closest("[data-depth]");
    if (depthEl) {
      state.depth = depthEl.getAttribute("data-depth");
      render();
      return;
    }

    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    const act = actEl.getAttribute("data-action");

    if (act === "refresh") {
      toast("已经是最新的了。代码结构有变化时会自动提醒你。");
      return;
    }
    if (act === "learn") {
      state.known.add(state.view);
      toast("记下了。这块以后只留一句提醒，不再占你注意力。");
      render();
      return;
    }
    if (act === "unlearn") {
      state.known.delete(state.view);
      render();
      return;
    }
    if (act === "correct") {
      state.correcting = !state.correcting;
      render();
      const ta = document.querySelector(".correct textarea");
      if (ta) ta.focus();
      return;
    }
    if (act === "simplify") {
      if (state.depth === "plain") {
        toast("已经是最简单的一版了。可以直接问我更具体的，比如“这里改了会坏哪”。");
      } else {
        state.depth = "plain";
        toast("换成更好懂的版本了。");
        render();
      }
      return;
    }
    if (act === "send-correct") {
      const ta = document.querySelector(".correct textarea");
      const v = ta ? ta.value.trim() : "";
      if (!v) {
        toast("先写一句哪儿不对。");
        return;
      }
      state.correcting = false;
      state.draft = "";
      toast("记下了。下次重新生成导览时会用你的说法。");
      return;
    }
  });

  document.addEventListener("input", (e) => {
    if (e.target.tagName === "TEXTAREA") state.draft = e.target.value;
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.correcting) {
      state.correcting = false;
      render();
    }
  });

  /* 深链：prototype/index.html#store 直接打开某个文件夹 */
  try {
    const hash = decodeURIComponent((location.hash || "").slice(1));
    if (hash === "home" || Object.prototype.hasOwnProperty.call(CARDS, hash)) state.view = hash;
    const m = /[?&]depth=(plain|structured|code)/.exec(location.search || "");
    if (m) state.depth = m[1];
  } catch (err) { /* file:// 下拿不到也没关系 */ }

  render();
})();
</script>
</body>
</html>
