<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="dsh-project-guide：把任意文件夹翻成说人话的项目导览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1c"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#d29922"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#1b2742"/>

  <text x="64" y="84" fill="#6f86bd" font-family="ui-monospace,Consolas,monospace" font-size="12.5" letter-spacing="2.6">DEEPSEEK HARNESS · 本地插件</text>

  <text x="62" y="150" fill="#f2f5ff" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">dsh-project-guide</text>

  <text x="64" y="196" fill="#c2cde8" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="19">看懂一个项目，从目录到代码。</text>
  <text x="64" y="226" fill="#7f8db2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14.5">事实从代码里读，人话由模型写；点开才算，不点不花钱。</text>

  <g font-family="ui-monospace,Consolas,monospace" font-size="12.5">
    <rect x="64" y="256" width="72" height="26" rx="13" fill="#111b30" stroke="#25345a"/>
    <text x="100" y="273" fill="#9fb3dd" text-anchor="middle">MIT</text>
    <rect x="146" y="256" width="152" height="26" rx="13" fill="#111b30" stroke="#25345a"/>
    <text x="222" y="273" fill="#9fb3dd" text-anchor="middle">Desktop + Web</text>
    <rect x="308" y="256" width="140" height="26" rx="13" fill="#111b30" stroke="#25345a"/>
    <text x="378" y="273" fill="#9fb3dd" text-anchor="middle">中文 / English</text>
  </g>

  <g transform="translate(766,50)">
    <rect x="0" y="0" width="372" height="240" rx="16" fill="#0a1324" stroke="#223050"/>
    <text x="20" y="28" fill="#5d7099" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.8">从目录一路看到代码</text>

    <rect x="16" y="42" width="340" height="54" rx="10" fill="#0e1a2f" stroke="#243458"/>
    <circle cx="34" cy="62" r="3.5" fill="#3fb950"/>
    <text x="48" y="67" fill="#e8eeff" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="14">文件夹 · 这是干嘛的</text>
    <text x="48" y="85" fill="#8497bd" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="11.5">放心改 / 要小心 / 别乱碰</text>

    <rect x="16" y="106" width="340" height="54" rx="10" fill="#0e1a2f" stroke="#243458"/>
    <circle cx="34" cy="126" r="3.5" fill="#d29922"/>
    <text x="48" y="131" fill="#e8eeff" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="14">文件 · 它在做什么</text>
    <text x="48" y="149" fill="#8497bd" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="11.5">按什么顺序干活，需要什么，产出什么</text>

    <rect x="16" y="170" width="340" height="54" rx="10" fill="#0e1a2f" stroke="#243458"/>
    <circle cx="34" cy="190" r="3.5" fill="#f85149"/>
    <text x="48" y="195" fill="#e8eeff" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="14">代码 · 这几行什么意思</text>
    <text x="48" y="213" fill="#8497bd" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="11.5">只在你点开时才讲，讲了就存下来</text>
  </g>

  <rect x="60" y="306" width="1080" height="3" rx="1.5" fill="url(#bar)" opacity="0.55"/>
</svg>
